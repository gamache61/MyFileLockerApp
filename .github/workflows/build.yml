name: Build Windows EXE
on:
  push:
    paths:
      - 'file_locker.py'
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --uac-admin --name "FileLocker" file_locker.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileLocker-Windows
          path: dist/FileLocker.exe
